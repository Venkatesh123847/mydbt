models:
  - name: dim_hosts_cleansed
    description: cleansed table for the airbnb hosts
    columns:
      - name: host_id
        description: the id of host . this is primary key 
        data_tests:
          - not_null
          - unique

      - name: host_name
        description: the name of host
        data_tests:
          - not_null

      - name: is_superhost
        description: define whether the host is superhost
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

  - name: dim_listings_with_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments: 
            compare_model: source('airbnb', 'listings')

    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments: 
                  column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments: 
                quantile: .99
                min_value: 50
                max_value: 500      
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                  max_value: 5000
              config:
                severity: warn    