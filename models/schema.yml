version: 2

models:
  - name: dim_listings_cleansed
    description: cleansed table which contain airbnb listings
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 100000000
          config:  
            severity: warn  
    columns:
      - name: listing_id
        description: primary key
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: the host's id. Refereance the host table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of appartment/room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']
      
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minmum_nights") }}'
        data_tests:
          - positive_values
  